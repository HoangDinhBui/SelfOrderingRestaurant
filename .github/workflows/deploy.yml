name: Java CI/CD with Maven and Render Deploy

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Tests run on every push/PR; a red suite blocks the Render deploy below
    - name: Build and test with Maven
      run: mvn -B clean verify

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        npm ci --prefix frontend
        npm run build --prefix frontend

    - name: Trigger Render Deploy Hook
      if: github.ref == 'refs/heads/master' && success()
      run: |
        if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
          echo "WARNING: RENDER_DEPLOY_HOOK_URL secret is not set. Skipping Render deployment trigger."
        else
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        fi
