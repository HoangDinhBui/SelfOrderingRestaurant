spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${google.client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:DEFAULT_SECRET}
            scope:
              - email
              - profile

jwt:
  # Base64 key, >= 64 bytes. Unset -> a random key is generated at startup (tokens die on restart)
  secret: ${JWT_SECRET:}
  access-token:
    expiration: 3600000 # 1 hour
  refresh-token:
    expiration: 604800000 # 7 days

google:
  client-id: ${GOOGLE_CLIENT_ID:DEFAULT_ID}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

file:
  upload-dir: uploads

restaurant:
  network:
    cidr: 172.20.10.0/24

server:
  port: ${PORT:8081}

attendance:
  # Múi giờ của giờ ca làm (server production chạy UTC)
  zone: ${ATTENDANCE_ZONE:Asia/Ho_Chi_Minh}

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.web: INFO

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
voice:
  stt:
    # PhoWhisper service (VoiceRecognition/), e.g. https://<user>-<space>.hf.space/transcribe
    url: ${VOICE_STT_URL:http://localhost:7860/transcribe}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name_here}
  api-key: ${CLOUDINARY_API_KEY:your_api_key_here}
  api-secret: ${CLOUDINARY_API_SECRET:your_api_secret_here}

# First admin account, created at startup only when no ADMIN exists and both values are set
bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
